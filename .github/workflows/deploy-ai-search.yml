name: Deploy AI search helper

# Publishes the ai-search/ Worker to Cloudflare, with the Anthropic and Google keys passed
# in as Cloudflare secrets. Needs the CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
# ANTHROPIC_API_KEY repository secrets (see README > AI Finder), plus GOOGLE_PLACES_API_KEY
# for the official-listings search (see README > Finding spots).
on:
  push:
    branches: [main]
    paths: ['ai-search/**', '.github/workflows/deploy-ai-search.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # wrangler 4 needs Node 22+
          cache: npm
          cache-dependency-path: ai-search/package-lock.json
      - run: npm ci
        working-directory: ai-search
      - name: Check the secrets are set
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY; do
            if [ -z "${!name}" ]; then echo "::warning::Add the $name repository secret (see README > AI Finder)."; missing=1; fi
          done
          # A Cloudflare account ID is 32 letters and numbers (0-9, a-f).
          account_id=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          if [ -n "$account_id" ] && ! printf '%s' "$account_id" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID doesn't look like a Cloudflare account ID (it is ${#account_id} characters; an account ID is 32 letters and numbers). Copy it again from Cloudflare's Account home and update the secret."
            exit 1
          fi
          echo "ready=$([ $missing = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # A manual run should fail loudly; an automatic run before setup just skips.
          if [ $missing = 1 ] && [ "${{ github.event_name }}" = workflow_dispatch ]; then exit 1; fi
      - name: Publish the helper and store the API keys in Cloudflare
        if: steps.secrets.outputs.ready == 'true'
        working-directory: ai-search
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          npx wrangler deploy
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          if [ -n "$GOOGLE_PLACES_API_KEY" ]; then
            printf '%s' "$GOOGLE_PLACES_API_KEY" | npx wrangler secret put GOOGLE_PLACES_API_KEY
          else
            echo "::warning::Add the GOOGLE_PLACES_API_KEY repository secret so the search bar can find official listings (see README > Finding spots)."
          fi
