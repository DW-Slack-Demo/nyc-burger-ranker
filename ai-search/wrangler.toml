name = "nyc-top10-ai-search"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Sites allowed to call this from a browser, comma-separated.
ALLOWED_ORIGINS = "https://dw-slack-demo.github.io,http://localhost:5173"

# Limits on how often searches can run, so a stranger with a script can't run up the
# Anthropic or Google bills. The site's own check on where a request comes from is easy
# to fake outside a browser, so these are the real guard. Periods can be 10 or 60 seconds.
# AI searches per visitor (by IP address) per minute.
[[ratelimits]]
name = "AI_LIMIT_PER_VISITOR"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# AI searches across everyone per minute.
[[ratelimits]]
name = "AI_LIMIT_TOTAL"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# "Find a spot" searches per visitor per minute.
[[ratelimits]]
name = "PLACES_LIMIT_PER_VISITOR"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

# ANTHROPIC_API_KEY is a secret, never stored here: `npx wrangler secret put ANTHROPIC_API_KEY`
