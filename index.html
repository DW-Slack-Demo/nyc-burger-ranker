<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Shelf</title>
  <!-- Lets people add Top Shelf to their phone's home screen and open it like an app. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Top Shelf">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F5EEE1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Bistro palette: cream paper, espresso ink, bordeaux and brass accents.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F5EEE1',
            card: '#FCF8F1',
            line: '#DDD0BA',
            ink: { DEFAULT: '#241C17', soft: '#5C4F44', muted: '#8C7E70' },
            wine: { DEFAULT: '#6F1D2A', dark: '#561520', light: '#F3E3E0' },
            brass: { DEFAULT: '#A6814A', light: '#EFE4CF' },
            vert: { DEFAULT: '#2F4A3B', dark: '#233A2D', light: '#E3EAE2' },
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
          },
        }
      }
    };
  </script>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
    /* Map pins: a teardrop in the pin's colour with its label upright inside. */
    .ts-pin-icon { background: none; border: none; }
    .ts-pin {
      width: 32px; height: 32px; margin: 1px;
      background: var(--pin); border: 2px solid #FCF8F1;
      border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(36, 28, 23, 0.35);
    }
    .ts-pin span {
      transform: rotate(45deg); color: #FCF8F1;
      font: 600 12px 'DM Sans', system-ui, sans-serif;
    }
    .ts-popup { font-family: 'DM Sans', system-ui, sans-serif; color: #241C17; }
    .ts-popup-name { font: 18px 'Playfair Display', Georgia, serif; line-height: 1.2; }
    .ts-popup-address { font-size: 12px; color: #8C7E70; margin: 2px 0 6px; }
    .ts-popup-line { font-size: 13px; color: #5C4F44; margin-top: 2px; }
    .ts-popup-link { display: inline-block; margin-top: 8px; font-size: 12px; color: #6F1D2A !important; text-decoration: underline; }
    .leaflet-container .leaflet-popup-content-wrapper { border-radius: 2px; background: #FCF8F1; }
    .leaflet-container .leaflet-popup-tip { background: #FCF8F1; }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/main.jsx"></script>
</body>
</html>
